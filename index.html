<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Zuko | EPK | Sound. Culture. Precision.</title>
<meta name="description" content="DJ Zuko — DJ, Producer, Studio Engineer, Live Audio Engineer. Afrobeats, Amapiano, Hip-Hop, R&B, Dancehall, Open Format. Las Vegas from November 2026. Available for travel.">
<meta name="theme-color" content="#0a0a0b">
<meta property="og:type" content="website">
<meta property="og:title" content="DJ Zuko | Electronic Press Kit">
<meta property="og:description" content="DJ, Producer, Studio & Live Audio Engineer. Las Vegas from November 2026. Available for travel. Bookings, mixes, media & more.">
<meta property="og:image" content="epk.png">
<style>
  :root{
    --bg:#0a0a0b; --panel:#111114; --ink:#f4f4f5; --muted:#a1a1aa;
    --red:#d81f26; --line:#26262b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 56px}
  header{text-align:center;padding:8px 0 20px}
  .word{
    font-weight:900; letter-spacing:.02em; line-height:.9;
    font-size:clamp(44px,12vw,88px); margin:0;
  }
  .word .z{color:var(--red)}
  .roles{
    margin:10px 0 4px; color:var(--muted); font-weight:600;
    font-size:clamp(11px,2.6vw,14px); letter-spacing:.06em; text-transform:uppercase;
  }
  .tag{
    margin:8px 0 0; font-style:italic; font-weight:700;
    font-size:clamp(15px,3.4vw,20px); letter-spacing:.01em;
  }
  .tag .red{color:var(--red)}
  .epk{
    display:block; width:100%; height:auto; border-radius:12px;
    margin:22px auto 0; border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.55);
  }
  .cta{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    margin:24px 0 8px;
  }
  @media(min-width:560px){ .cta{grid-template-columns:repeat(4,1fr)} }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:14px 12px;
    font-weight:700; font-size:14px; transition:border-color .15s,transform .05s;
  }
  .btn:hover{border-color:var(--red)}
  .btn:active{transform:translateY(1px)}
  .btn.book{background:var(--red); border-color:var(--red)}
  .btn.book:hover{filter:brightness(1.08)}
  .meta{
    text-align:center; color:var(--muted); font-size:13px; margin-top:22px;
    padding-top:18px; border-top:1px solid var(--line);
  }
  .meta strong{color:var(--ink)}
  .loc{ color:var(--red); font-weight:700 }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="word">DJ <span class="z">ZUKO</span></h1>
      <p class="roles">DJ &bull; Producer &bull; Studio Engineer &bull; Live Audio Engineer</p>
      <p class="tag">Sound. <span class="red">Culture.</span> Precision.</p>
    </header>

    <nav class="cta">
      <a class="btn book" href="mailto:djzuko.fl@gmail.com?subject=Booking%20Inquiry%20for%20DJ%20Zuko">Book / Email</a>
      <a class="btn" href="tel:+12136508370">Call</a>
      <a class="btn" href="https://instagram.com/DJZUKO_2" target="_blank" rel="noopener">Instagram</a>
      <a class="btn" href="https://youtube.com/@FIRENATIONRADIO" target="_blank" rel="noopener">YouTube</a>
    </nav>

    <img class="epk" src="epk.png" alt="DJ Zuko Electronic Press Kit — services, residencies, experience, equipment, and contact information.">

    <p class="meta">
      <strong>DJ Zuko</strong> &bull; <span class="loc">Las Vegas</span> &bull; from November 2026 &bull; Available for Travel &bull; Nationwide &amp; International<br>
      Bookings &bull; Mixes &bull; Media &bull; Events &bull; djzuko.fl@gmail.com &bull; (213) 650-8370
    </p>
  </div>
</body>
</html>
